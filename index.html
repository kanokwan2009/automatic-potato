<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHOES OF AETHER - 3D RPG</title>
    <link rel="stylesheet" href="style.css">
    <!-- โหลด Three.js ผ่าน CDN เพื่อความเสถียรและเล่นได้ทันที -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <div id="hud">
            <h2>ECHOES OF AETHER 3D</h2>
            <div class="stat-row">❤️ HP: <span id="hp-val">100</span>/100</div>
            <div class="stat-row">⭐ LV: <span id="lv-val">1</span> | 💰 Gold: <span id="gold-val">50</span></div>
            <div class="controls-hint">🎮 ควบคุม: W, A, S, D เพื่อเดิน</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
